<!--
  First Baptist Church Muncie favicon. The tower from the church's own
  wordmark (src/assets/logo-light.svg, captured from the Wix site on
  2026-09-19), isolated onto its own square icon on 2026-09-20. Paths are
  copied unchanged from the source, filtered to the tower group only: the
  browns (#39251e, #724f43), the taupe face (#b5aba3), and the gold window
  panes plus roof and ground line (#d59b29) between the words FIRST and
  BAPTIST. No lettering.

  Ground: a navy (#292854) rounded square behind the tower. Two reasons.
  The taupe face is light enough to vanish against a light browser tab, and
  the touch icon generator (scripts/generate-favicons.mjs) needs an opaque
  plate for iOS to composite on, since it renders straight from this file
  with no background of its own.

  viewBox: the tower group's measured bounding box (Playwright getBBox on
  the isolated group) is x 78.57, y 1.53, width 64.58, height 92.20. The
  square frame uses the taller axis (height) with an 8 percent margin on
  each side: side = 92.20 * 1.16 = 106.95, centered on the bbox center
  (110.86, 47.63), giving the viewBox below. The tower is narrower than it
  is tall, so the left and right margins run wider than 8 percent by
  design; that is the square canvas, not a measurement error.
-->

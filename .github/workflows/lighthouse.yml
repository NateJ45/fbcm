# The family test standard's Lighthouse workflow (PORTS.md card 35).
# Deliberately NOT marked PORTABLE: like ci.yml it carries a per-site `env:`
# block, and the `url` list in lighthouserc.json names the pages a given repo
# builds. The ASSERTIONS in lighthouserc.json are the part that must not
# diverge. Copy the shape, not the bytes.
#
# ── WHEN IT RUNS (PORTS.md card 70) ─────────────────────────────────────────
# Lighthouse was the slowest gate after Playwright (494s: 9 URLs x 3 runs) and
# it ran on every PR, including ones that cannot move a score. It is NOT a
# required status check, so it is free to be scheduled rather than blocking:
#
#   - pull_request, path-filtered to what can move a score (markup, styles,
#     assets, the build chain, config), and audited on a SAMPLE of URLs, one per
#     distinct template, via --collect.url flags below. The full list in
#     lighthouserc.json is untouched.
#   - push to main, same path filter, FULL url list: the post-merge record.
#   - weekly schedule, FULL url list: catches drift nobody pushed (a font host
#     change, a dependency bump that landed on a different path).
#   - workflow_dispatch: a branch tip on demand, full list.
#
# A docs-only, content-only or workflow-only PR therefore runs no Lighthouse and
# reports no check.
name: Lighthouse

on:
  push:
    branches: [main]
    paths: &score-paths
      - 'src/**'
      - 'public/**'
      - 'scripts/serve-dist.mjs'
      # The build chain: each of these writes into the pages Lighthouse audits.
      - 'scripts/generate-og-pages.mjs'
      - 'scripts/fetch-scripture.mjs'
      - 'scripts/visitor-covers.mjs'
      - 'scripts/fetch-youtube-feed.mjs'
      - 'scripts/pagefind-index.mjs'
      - 'lighthouserc.json'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lighthouse.yml'
  pull_request:
    paths: *score-paths
  schedule:
    - cron: '17 5 * * 1'
  # Dispatchable so a branch tip can be re-audited on demand, without pushing
  # an empty commit.
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The Visitor's covers and words (feat/the-visitor): scripts/visitor-covers.mjs
      # draws each issue's cover and reads its text at the start of `npm run build`,
      # keyed by the file's asset id. Without this a cold runner downloads every
      # issue (about 630 MB) to redraw covers it drew last time; with it, only a
      # new issue is fetched. The cache itself is about 7 MB.
      - name: Restore The Visitor's covers
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/visitor
          key: visitor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: visitor-${{ runner.os }}-

      # Same build ci.yml runs: consumes the committed src/lib/sanity.types.ts,
      # emits dist/client (audited here) and dist/server (the SSR bundle for
      # /studio and /preview, which lhci never sees).
      - name: Build
        # Public identifiers (they ship in every image URL). Without them
        # sanityFetch returns fallbacks, the Sanity-backed pages (every page
        # document since plan 2b, including /contact) are never emitted, and
        # Lighthouse reports ERRORED_DOCUMENT_REQUEST on a 404 (2026-09-20).
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
        run: npm run build

      # Accessibility is a hard gate (minScore 1) in lighthouserc.json, as are
      # LCP 4500ms and CLS 0.1; performance, best-practices and SEO are
      # warnings so normal CI variance does not block a PR.
      #
      # On a PR the URL list is overridden with ONE PAGE PER TEMPLATE. Passing
      # --collect.url replaces the config's list, so the assertions and the
      # median-of-3 stay exactly as the standard defines them; only the page set
      # shrinks. The sample, by template (src/pages): / (index.astro), /visit/
      # ([slug].astro, which also renders staff, history and contact: same page
      # builder, different blocks), /blog/ (the listing), one post
      # (post/[slug].astro, the non-ASCII slug), /privacy/ (privacy.astro) and
      # the bespoke 404.
      - name: Lighthouse CI (sample, pull request)
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          npx lhci autorun
          --collect.url=http://localhost:4173/
          --collect.url=http://localhost:4173/visit/
          --collect.url=http://localhost:4173/blog/
          --collect.url=http://localhost:4173/post/h%C3%A4ndel-s-messiah-sing-in-carols/
          --collect.url=http://localhost:4173/privacy/
          --collect.url=http://localhost:4173/404.html

      - name: Lighthouse CI (full)
        if: ${{ github.event_name != 'pull_request' }}
        run: npx lhci autorun

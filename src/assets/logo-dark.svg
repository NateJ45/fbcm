<!--
  First Baptist Church Muncie wordmark, from the church's own Wix site
  (2026-09-19 capture). Five brand colours; do not recolour by hand, edit
  brand.config.json instead.

  For INDIGO grounds: the footer in both themes, and the header in dark mode.
  ONE colour differs from the light file: the indigo lettering (#292854) is
  cream (#f4efe6), because indigo on indigo is nothing. Gold, taupe and both
  browns are exactly as captured. The dark brown (#39251e) was checked on the
  indigo-field ground (#353351) and kept: it measures 1.22:1 against that ground, but it
  is the tower's shaded face sitting next to its lit face, so it reads as shape
  rather than disappearing. Lifting it to the mid-brown flattens the tower.
-->
